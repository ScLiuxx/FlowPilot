name: flowpilot

# FlowPilot runs as a modular monolith plus a separate Agent Runtime.
#
# The API and the worker use the same jar and differ only in the Spring profile, so the node
# execution capacity can be scaled independently of the HTTP layer.
#
# The observability stack is part of the same compose file:
#   prometheus      9090  scrapes the backend actuator and the otel collector
#   grafana         3000  dashboards provisioned from ops/grafana
#   nginx            80   single entry point, proxies the console and the backend API
#   otel-collector 4317   OTLP gRPC receiver
#                   4318   OTLP HTTP receiver
#                   8889   prometheus exporter of the collector
#
# The Java side reads the collector endpoint from the environment, for example
# OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317.

services:
  mysql:
    image: mysql:8.0
    container_name: flowpilot-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-flowpilot-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-flowpilot}
      MYSQL_USER: ${MYSQL_USERNAME:-flowpilot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-flowpilot}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-flowpilot-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [flowpilot]

  redis:
    image: redis:7-alpine
    container_name: flowpilot-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [flowpilot]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: flowpilot-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-flowpilot}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-flowpilot}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks: [flowpilot]

  postgres:
    image: postgres:16-alpine
    container_name: flowpilot-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowpilot}
      POSTGRES_DB: ${POSTGRES_DATABASE:-flowpilot_agent}
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowpilot}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [flowpilot]

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flowpilot-backend-api
    environment:
      SPRING_PROFILES_ACTIVE: api
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      JWT_SECRET: ${JWT_SECRET:-flowpilot-development-secret-key-change-me-in-production-000}
      WORKER_ID: api-01
      # The token raises the rate limit of the GitHub API.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # The agent service is reached under the name of its service in the network
      # of the project, not under the loopback address of the container.
      AGENT_SERVICE_URL: http://agent-worker:8000
      # The secret of the internal endpoints of the agent service.
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:-flowpilot-internal-token-change-me-in-production}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [flowpilot]

  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # No container_name here: it would prevent the service from being scaled
    # to several replicas, because the container names would collide.
    environment:
      SPRING_PROFILES_ACTIVE: worker
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      JWT_SECRET: ${JWT_SECRET:-flowpilot-development-secret-key-change-me-in-production-000}
      # The token raises the rate limit of the GitHub API.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # The identity of the worker has to be unique per replica, otherwise the
      # logs and the metrics of the replicas cannot be told apart. Nothing is
      # configured here on purpose: the backend falls back to the hostname of
      # the container, which Docker sets to the unique container id. Set
      # WORKER_ID to pin the identity of a single replica.
      # The agent service is reached under the name of its service in the network
      # of the project, not under the loopback address of the container.
      AGENT_SERVICE_URL: http://agent-worker:8000
      # The secret of the internal endpoints of the agent service.
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:-flowpilot-internal-token-change-me-in-production}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      replicas: 2
    networks: [flowpilot]

  agent-worker:
    build:
      context: .
      dockerfile: agent-service/Dockerfile
    # No container_name here either: the agent worker can be scaled as well,
    # and the container names would collide.
    environment:
      # The service reads the broker and the database from the url, not from
      # single variables.
      RABBITMQ_URL: amqp://${RABBITMQ_USERNAME:-flowpilot}:${RABBITMQ_PASSWORD:-flowpilot}@rabbitmq:5672/
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-flowpilot}:${POSTGRES_PASSWORD:-flowpilot}@postgres:5432/${POSTGRES_DATABASE:-flowpilot_agent}
      REDIS_URL: redis://redis:6379/0
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      # The Java backend reads the invocation state through the internal
      # endpoints, so both sides use the same secret.
      INTERNAL_API_TOKEN: ${AGENT_INTERNAL_TOKEN:-flowpilot-internal-token-change-me-in-production}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 2
    networks: [flowpilot]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flowpilot-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend-api
    networks: [flowpilot]

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: flowpilot-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    depends_on:
      backend-api:
        condition: service_started
    networks: [flowpilot]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: flowpilot-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-flowpilot}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_INSTALL_PLUGINS: ""
    ports:
      - "3000:3000"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    networks: [flowpilot]

  nginx:
    image: nginx:1.27-alpine
    container_name: flowpilot-nginx
    # The configuration contains the events and the http block, so it is used as the main
    # configuration file instead of being included by the default one.
    command: ["nginx", "-c", "/etc/nginx/conf.d/default.conf", "-g", "daemon off;"]
    ports:
      - "80:80"
    volumes:
      - ./ops/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend-api:
        condition: service_started
      frontend:
        condition: service_started
    networks: [flowpilot]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    container_name: flowpilot-otel-collector
    command: ["--config=/etc/otelcol/config.yml"]
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    volumes:
      - ./ops/otel-collector/config.yml:/etc/otelcol/config.yml:ro
    depends_on:
      prometheus:
        condition: service_started
    networks: [flowpilot]

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  postgres-data:
  prometheus-data:
  grafana-data:

networks:
  flowpilot:
    driver: bridge
