# Profile of the worker instances.
#
# The API and the worker share the same jar. The worker takes on the node execution load with a
# higher consumer concurrency, while the API instance stays focused on serving the console.
spring:
  rabbitmq:
    listener:
      simple:
        concurrency: 4
        max-concurrency: 16

flowpilot:
  worker:
    # The identity of a worker replica. It has to be unique per replica, because the lease
    # records the owner and the logs of two replicas with the same name cannot be told apart.
    # Nothing is configured on purpose: the hostname of the container is used, which Docker
    # sets to the unique container id. WORKER_ID pins the identity of a single replica.
    id: ${WORKER_ID:${HOSTNAME:worker-01}}
    max-concurrency: 16
    lease-seconds: 60

logging:
  level:
    com.flowpilot: INFO
