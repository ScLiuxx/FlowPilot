spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${TEST_MYSQL_DATABASE:flowpilot_test}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
    username: ${MYSQL_USERNAME:flowpilot}
    password: ${MYSQL_PASSWORD:flowpilot}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:flowpilot}
    password: ${RABBITMQ_PASSWORD:flowpilot}
    listener:
      simple:
        auto-startup: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: false
    clean-on-validation-error: true

flowpilot:
  security:
    jwt:
      secret: flowpilot-integration-test-secret-key-0123456789abcdef
      expiration-seconds: 3600
  seed:
    enabled: false
  messaging:
    outbox:
      enabled: false
      poll-interval-ms: 60000
  recovery:
    enabled: false
    interval-ms: 600000
  retry:
    enabled: false
    interval-ms: 600000

logging:
  level:
    root: WARN
    com.flowpilot: INFO
