server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The console is a single page application, so every unknown path serves the entry document.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The API is served by the backend. The proxy keeps the browser on one origin, so no CORS
    # configuration is needed in the development setup.
    location /api/ {
        proxy_pass http://backend-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The execution progress is streamed over SSE, which must not be buffered.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    location /actuator/ {
        proxy_pass http://backend-api:8080;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
