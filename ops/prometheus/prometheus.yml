# Prometheus scrape configuration for FlowPilot.
#
# The container resolves the service names of the compose network, so the targets below are
# the compose service names and not the host ports.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    application: flowpilot

scrape_configs:
  # The Spring Boot backend exposes its Micrometer registry through the actuator.
  - job_name: backend-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - backend-api:8080
        labels:
          service: backend-api

  # The OpenTelemetry collector republishes the metrics it receives on its own prometheus
  # exporter endpoint.
  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets:
          - otel-collector:8889
        labels:
          service: otel-collector
