# Nginx configuration for the FlowPilot gateway.
#
# The file is a complete configuration (events + http) and replaces the main nginx.conf of
# the image. It is also mounted to /etc/nginx/conf.d/default.conf, the conventional location
# of the server definitions, so both paths point to the same content.

user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Reports and imported documents are uploaded through the gateway.
    client_max_body_size 32m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml font/woff font/woff2
               application/wasm;

    # The console is served by the nginx image of the frontend container.
    upstream frontend {
        server frontend:80;
        keepalive 32;
    }

    # The API and the SSE stream are served by the Spring Boot backend.
    upstream backend_api {
        server backend-api:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # The backend API, including the execution event stream.
        location /api/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;

            # A long lived SSE connection must not be closed after the first chunk.
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Server sent events must not be buffered, otherwise the client receives them
            # only after the response is finished.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            chunked_transfer_encoding off;
        }

        # The console is a single page application, the fallback is handled by the frontend.
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}
