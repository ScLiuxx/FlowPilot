# OpenTelemetry collector configuration for FlowPilot.
#
# The backend and the agent service push OTLP data to this collector. Metrics are exported
# through the prometheus exporter, so Prometheus can scrape them on port 8889.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Protects the collector from an overload of spans or metrics.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  # Batches the data before it is handed over to the exporters.
  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  # Traces are only written to the collector log for now. A jaeger or tempo exporter can be
  # added here without touching the application configuration.
  debug:
    verbosity: basic
  # Publishes the metrics in the prometheus format on :8889/metrics.
  prometheus:
    endpoint: 0.0.0.0:8889
    enable_open_metrics: true
    resource_to_telemetry_conversion:
      enabled: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions:
    - health_check
  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - batch
      exporters:
        - debug
    metrics:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - batch
      exporters:
        - prometheus
        - debug
